[project]
name = "wiki-rag-mcp"
version = "0.1.0"
description = "RAG over a markdown knowledge base: LangGraph agent, MCP server/client, and Ragas evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9",
  "langgraph>=0.4",
  "langchain-core>=0.3",
  "langchain-ollama>=0.3",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = ["ragas>=0.2", "rapidfuzz>=3", "langchain-community>=0.3,<0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
wikirag-index = "wikirag.index:main"
wikirag-server = "wikirag.server:main"
wikirag-ask = "wikirag.graph:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikirag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
